<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat with AI — KNOWZA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='knowza.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="glow a"></div><div class="glow b"></div><div class="rays"></div><div class="horizon"></div>
<div class="chat-page">
  <header class="site-header">
    <a class="brand" href="{{ url_for('dashboard') }}">KNOWZA</a>
    <div class="header-right">
      <a href="{{ url_for('dashboard') }}">Dashboard</a>
      <a href="#" onclick="clearChat();return false;">New chat</a>
      <span>{{ user }}</span>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </header>

  <main class="scroller" id="scroller">
    <div class="thread-wrap">
      <div class="welcome" id="welcome">
        <h1>How can I help you study today?</h1>
        <p>Ask a question, or attach your notes, a PDF or a photo of a problem.</p>
      </div>
      <div id="thread"></div>
    </div>
  </main>

  <footer class="composer-dock">
    <div class="composer">
      <div id="file-list"></div>
      <textarea id="question-input" placeholder="Message KNOWZA" rows="1"></textarea>
      <input type="file" id="file-input" multiple hidden accept=".pdf,.docx,.txt,.md,.csv,.py,.js,.html,.json" />
      <input type="file" id="image-input" multiple hidden accept="image/*" />
      <div class="composer-bar">
        <div class="attach-wrap">
          <button type="button" class="icon-btn" id="attach-btn" title="Attach files" aria-label="Attach files">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>
          </button>
          <div class="attach-menu" id="attach-menu">
            <button type="button" data-pick="file">Upload files / PDF<small>PDF, DOCX, TXT, MD, CSV, code</small></button>
            <button type="button" data-pick="image">Upload images<small>PNG, JPG, GIF, WEBP</small></button>
          </div>
        </div>
        <span id="file-count-label"></span>
        <button class="send-btn" id="ask-btn" onclick="submitQuestion()" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <p class="dock-note">KNOWZA can make mistakes. Verify important information.</p>
  </footer>
</div>

<script>
    // ===== FILE MANAGEMENT =====
    let attachedFiles = [];

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(1) + ' MB';
    }

    function getFileIcon(name) {
      return name.split('.').pop().toUpperCase().slice(0, 4);
    }

    function esc(t) { return t.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function renderFileChips() {
      const list = document.getElementById('file-list');
      const label = document.getElementById('file-count-label');
      list.innerHTML = '';
      attachedFiles.forEach((f, i) => {
        const chip = document.createElement('div');
        chip.className = 'file-chip';
        const lead = f.type.startsWith('image/')
          ? `<img class="fc-thumb" src="${URL.createObjectURL(f)}" alt="">`
          : `<span class="fc-ext">${getFileIcon(f.name)}</span>`;
        chip.innerHTML = `${lead}
          <span class="fc-name" title="${esc(f.name)}">${esc(f.name)}</span>
          <span class="fc-size">${formatBytes(f.size)}</span>
          <button class="fc-del" onclick="removeFile(${i})" aria-label="Remove">&times;</button>`;
        list.appendChild(chip);
      });
      label.textContent = attachedFiles.length > 0 ? `${attachedFiles.length} file${attachedFiles.length > 1 ? 's' : ''} attached` : '';
    }

    function removeFile(idx) { attachedFiles.splice(idx, 1); renderFileChips(); }

    const MAX_TOTAL = 20 * 1024 * 1024;
    const ALLOWED = ['pdf','docx','txt','md','csv','py','js','html','json','png','jpg','jpeg','gif','bmp','webp'];

    // Shrink big photos so uploads stay small and fast
    function compressImage(file) {
      return new Promise(resolve => {
        if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.size < 800 * 1024) return resolve(file);
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const max = 1600, r = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          cv.toBlob(b => {
            URL.revokeObjectURL(url);
            if (!b || b.size >= file.size) return resolve(file);
            resolve(new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }));
          }, 'image/jpeg', 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
        img.src = url;
      });
    }

    async function addFiles(list) {
      list = await Promise.all(Array.from(list).map(compressImage));
      const rejected = [];
      list.forEach(f => {
        const ext = f.name.split('.').pop().toLowerCase();
        if (!ALLOWED.includes(ext)) { rejected.push(f.name); return; }
        if (attachedFiles.find(x => x.name === f.name && x.size === f.size)) return;
        attachedFiles.push(f);
      });
      const total = attachedFiles.reduce((n, f) => n + f.size, 0);
      if (total > MAX_TOTAL) {
        alert('Total size exceeds 20 MB. Remove some files.');
      }
      if (rejected.length) alert('Unsupported file type: ' + rejected.join(', '));
      renderFileChips();
    }

    const attachBtn = document.getElementById('attach-btn');
    const attachMenu = document.getElementById('attach-menu');
    attachBtn.addEventListener('click', e => { e.stopPropagation(); attachMenu.classList.toggle('open'); });
    document.addEventListener('click', () => attachMenu.classList.remove('open'));
    attachMenu.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      document.getElementById(b.dataset.pick === 'image' ? 'image-input' : 'file-input').click();
      attachMenu.classList.remove('open');
    }));
    ['file-input', 'image-input'].forEach(id => {
      document.getElementById(id).addEventListener('change', function () { addFiles(this.files); this.value = ''; });
    });

    // Drag & drop anywhere on the input area
    const ia = document.querySelector('.composer');
    ia.addEventListener('dragover', e => { e.preventDefault(); ia.classList.add('drag-over'); });
    ia.addEventListener('dragleave', () => ia.classList.remove('drag-over'));
    ia.addEventListener('drop', e => { e.preventDefault(); ia.classList.remove('drag-over'); addFiles(e.dataTransfer.files); });

    // Paste screenshots / images
    document.getElementById('question-input').addEventListener('paste', e => {
      const files = Array.from(e.clipboardData.files || []);
      if (files.length) { e.preventDefault(); addFiles(files.map((f, i) => f.name === 'image.png' ? new File([f], 'pasted-' + Date.now() + '-' + i + '.png', { type: f.type }) : f)); }
    });

    // ===== CHAT =====
    const thread = document.getElementById('thread');
    const scroller = document.getElementById('scroller');
    const input = document.getElementById('question-input');
    const sendBtn = document.getElementById('ask-btn');
    let busy = false;

    function toBottom() { scroller.scrollTop = scroller.scrollHeight; }
    function autoGrow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 200) + 'px'; }
    input.addEventListener('input', autoGrow);

    function addUser(text, files) {
      document.getElementById('welcome').classList.add('hidden');
      const d = document.createElement('div');
      d.className = 'msg user';
      const chips = files.map(f => `<span class="mchip">${esc(f.name)}</span>`).join('');
      d.innerHTML = `<div class="bubble">${text ? esc(text).replace(/\n/g, '<br>') : ''}${chips ? `<div class="mchips">${chips}</div>` : ''}</div>`;
      thread.appendChild(d); toBottom();
    }
    function addAssistant() {
      const d = document.createElement('div');
      d.className = 'msg ai';
      d.innerHTML = '<div class="avatar">A</div><div class="answer"><div class="typing"><span></span><span></span><span></span></div></div>';
      thread.appendChild(d); toBottom();
      return d.querySelector('.answer');
    }

    async function submitQuestion() {
      if (busy) return;
      const question = input.value.trim();
      if (!question && attachedFiles.length === 0) { input.focus(); return; }
      busy = true; sendBtn.disabled = true;

      const files = attachedFiles.slice();
      addUser(question, files);
      const out = addAssistant();
      input.value = ''; autoGrow();
      attachedFiles = []; renderFileChips();

      try {
        const fd = new FormData();
        fd.append('question', question);
        files.forEach(f => fd.append('files', f));
        const res = await fetch('/ask-with-file', { method: 'POST', body: fd });
        if (!res.ok) { out.innerHTML = '<span class="errtxt">' + esc((await res.text()).replace(/\*/g, '').trim() || ('Server error: ' + res.status)) + '</span>'; return; }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (value) {
            buffer += decoder.decode(value, { stream: !done });
            out.innerHTML = window.marked ? marked.parse(buffer) : esc(buffer).replace(/\n/g, '<br>');
            toBottom();
          }
          if (done) break;
        }
      } catch (err) {
        out.innerHTML = '<span class="errtxt">Could not reach the server (' + esc(err.message) + '). Make sure the Flask app is still running, then try again.</span>';
      } finally {
        busy = false; sendBtn.disabled = false; input.focus(); toBottom();
      }
    }

    function clearChat() {
      thread.innerHTML = '';
      document.getElementById('welcome').classList.remove('hidden');
      input.value = ''; autoGrow();
      attachedFiles = []; renderFileChips();
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
    });
    input.focus();
  </script>
</body>
</html>
